[workspace]
resolver = "2"
members = [
    "common",
    "agentd",
    "egress-proxy",
    "ops-cli",
    "plane",
    "plane-common",
    "plane-dynamic-proxy",
    "plane-tests",
    "plane-test-macro",
    "tools/generate-schemas",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"

[workspace.lints.rust]
unused_imports = "deny"
dead_code = "deny"
unreachable_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
clone_on_ref_ptr = "warn"
inefficient_to_string = "warn"
needless_collect = "warn"
manual_async_fn = "warn"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
schemars = "0.8"
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"
envoy-types = "0.7"
tracing = "0.1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json"] }
tabled = "0.17"
plane = { path = "plane" }
plane-common = { path = "plane-common" }
plane-dynamic-proxy = { path = "plane-dynamic-proxy" }
