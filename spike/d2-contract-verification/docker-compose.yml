name: plane-d2-spike

services:
  postgres:
    image: postgres:16
    container_name: d2-postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 2s
      retries: 30

  controller:
    image: plane/plane:latest
    container_name: d2-controller
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - controller
      - --db
      - postgres://postgres@postgres
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --default-cluster
      - "localhost:9090"
    ports:
      - "127.0.0.1:18080:8080"

  proxy:
    image: plane/plane:latest
    container_name: d2-proxy
    depends_on:
      - controller
    command:
      - proxy
      - --controller-url
      - "ws://controller:8080"
      - --cluster
      - "localhost:9090"
      - --http-port
      - "9090"
    ports:
      - "127.0.0.1:19090:9090"
