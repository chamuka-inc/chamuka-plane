services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane"]
      interval: 2s
      timeout: 5s
      retries: 10

  controller:
    image: chamuka-plane:latest
    command: ["controller", "--db=postgres://plane:plane@postgres:5432/plane", "--default-cluster=plane.test", "--host=0.0.0.0", "--port=9090"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9090:9090"
    environment:
      RUST_LOG: info

  drone:
    image: chamuka-plane:latest
    command: ["drone", "--controller-url=ws://controller:9090", "--cluster=plane.test", "--pool=untrusted"]
    depends_on:
      - controller
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      RUST_LOG: info

  proxy:
    image: chamuka-plane:latest
    command: ["proxy", "--controller-url=ws://controller:9090", "--cluster=plane.test", "--http-port=8080"]
    depends_on:
      - controller
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: info
