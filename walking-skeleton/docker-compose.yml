services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane"]
      interval: 2s
      timeout: 5s
      retries: 10

  controller:
    image: plane/plane:latest
    command: ["controller", "--db-url=postgres://plane:plane@postgres:5432/plane"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9090:9090"
    environment:
      RUST_LOG: info

  drone:
    image: plane/plane:latest
    command: ["drone", "--controller-url=ws://controller:9090", "--pool=untrusted"]
    depends_on:
      - controller
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      RUST_LOG: info

  proxy:
    image: plane/plane:latest
    command: ["proxy", "--controller-url=ws://controller:9090"]
    depends_on:
      - controller
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: info
