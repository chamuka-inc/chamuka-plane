# Host-side control plane.
#
# Image and CLI flags verified against github.com/jamsocket/plane
# (docker/docker-compose.yml, plane/src/controller/command.rs,
# plane/src/proxy/command.rs).

name: sandbox-platform-dev

services:
  postgres:
    image: postgres:16
    container_name: sandbox-postgres
    restart: unless-stopped
    environment:
      # Matches the upstream Plane dev compose: passwordless trust auth.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${HOST_BIND_IP:-192.168.56.1}:5432:5432"
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  controller:
    # Verified: Plane is published as plane/plane on Docker Hub.
    # https://hub.docker.com/r/plane/plane/tags
    image: plane/plane:latest
    container_name: sandbox-controller
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Verified flags from plane/src/controller/command.rs:
    #   --db <pg url>             required
    #   --host <ip>               default 127.0.0.1
    #   --port <port>             default 8080
    #   --default-cluster <name>  optional default cluster for connect
    command:
      - controller
      - --db
      - postgres://postgres@postgres
      - --host
      - 0.0.0.0
      - --port
      - "${CONTROLLER_PORT:-8080}"
      - --default-cluster
      - "${CLUSTER_NAME:-192.168.56.1:9090}"
    ports:
      - "${HOST_BIND_IP:-192.168.56.1}:${CONTROLLER_PORT:-8080}:${CONTROLLER_PORT:-8080}"
      - "127.0.0.1:${CONTROLLER_PORT:-8080}:${CONTROLLER_PORT:-8080}"
    healthcheck:
      # Verified: /pub/health is the public health route
      # (plane/src/controller/mod.rs).
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${CONTROLLER_PORT:-8080}/pub/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  proxy:
    image: plane/plane:latest
    container_name: sandbox-proxy
    restart: unless-stopped
    depends_on:
      controller:
        condition: service_healthy
    # Verified flags from plane/src/proxy/command.rs:
    #   --controller-url <ws url> required
    #   --cluster <name>          required
    #   --http-port <port>        default 9090 in non-HTTPS mode
    # Note WebSocket scheme (ws://) — the proxy connects to the
    # controller over a WS for coordination.
    command:
      - proxy
      - --controller-url
      - "ws://controller:${CONTROLLER_PORT:-8080}"
      - --cluster
      - "${CLUSTER_NAME:-192.168.56.1:9090}"
      - --http-port
      - "${PROXY_PORT:-9090}"
    ports:
      - "${HOST_BIND_IP:-192.168.56.1}:${PROXY_PORT:-9090}:${PROXY_PORT:-9090}"
      - "127.0.0.1:${PROXY_PORT:-9090}:${PROXY_PORT:-9090}"

  # Pull-through cache for sandbox runtime images.
  registry:
    image: registry:2
    container_name: sandbox-registry
    restart: unless-stopped
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
    volumes:
      - registry:/var/lib/registry
    ports:
      - "${HOST_BIND_IP:-192.168.56.1}:5000:5000"
      - "127.0.0.1:5000:5000"

volumes:
  pgdata:
  registry:
