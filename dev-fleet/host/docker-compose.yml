# Host-side control plane.
#
# Image and CLI flags verified against github.com/jamsocket/plane
# (docker/docker-compose.yml, plane/src/controller/command.rs,
# plane/src/proxy/command.rs).
#
# Services bind to 0.0.0.0 so they're reachable from both localhost
# and the VirtualBox host-only network (192.168.56.1) without
# requiring the vboxnet interface to exist at compose-up time.

name: sandbox-platform-dev

services:
  postgres:
    image: postgres:16
    container_name: sandbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  controller:
    image: chamuka-plane:latest
    container_name: sandbox-controller
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - controller
      - --db
      - postgres://postgres@postgres
      - --host
      - 0.0.0.0
      - --port
      - "${CONTROLLER_PORT:-8080}"
      - --default-cluster
      - "${CLUSTER_NAME:-192.168.56.1:9090}"
    ports:
      - "0.0.0.0:${CONTROLLER_PORT:-8080}:${CONTROLLER_PORT:-8080}"
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "--spider", "http://localhost:${CONTROLLER_PORT:-8080}/pub/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  proxy:
    image: chamuka-plane:latest
    container_name: sandbox-proxy
    restart: unless-stopped
    depends_on:
      controller:
        condition: service_healthy
    command:
      - proxy
      - --controller-url
      - "ws://controller:${CONTROLLER_PORT:-8080}"
      - --cluster
      - "${CLUSTER_NAME:-192.168.56.1:9090}"
      - --http-port
      - "${PROXY_PORT:-9090}"
    ports:
      - "0.0.0.0:${PROXY_PORT:-9090}:${PROXY_PORT:-9090}"

  registry:
    image: registry:2
    container_name: sandbox-registry
    restart: unless-stopped
    volumes:
      - registry:/var/lib/registry
    ports:
      - "0.0.0.0:5000:5000"

volumes:
  pgdata:
  registry:
