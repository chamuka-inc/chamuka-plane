# Full dev fleet — multi-drone cluster running entirely in Docker.
#
# Replaces the Vagrant setup when VirtualBox is unavailable.
# Topology:
#   - 1 controller
#   - 1 proxy
#   - 3 drones (1 trusted/runc, 2 untrusted/runc — gVisor requires host VM config)
#   - 1 postgres
#   - 1 registry
#
# All drones share the host Docker socket and spawn sandbox containers
# as siblings. The proxy routes to those containers via host.docker.internal.
#
# Usage:
#   cd dev-fleet && docker compose up -d
#   docker compose exec drone-1 plane drone --help   # inspect
#   ../dev-fleet/scripts/smoke-test.sh               # e2e test

name: sandbox-dev-fleet

services:
  postgres:
    image: postgres:16
    container_name: fleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  controller:
    image: chamuka-plane:latest
    container_name: fleet-controller
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - controller
      - --db
      - postgres://postgres@postgres
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --default-cluster
      - "localhost:9090"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      RUST_LOG: info

  proxy:
    image: chamuka-plane:latest
    container_name: fleet-proxy
    restart: unless-stopped
    depends_on:
      - controller
    command:
      - proxy
      - --controller-url
      - ws://controller:8080
      - --cluster
      - "localhost:9090"
      - --http-port
      - "9090"
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      RUST_LOG: info

  # Drone 1: trusted pool (runc)
  drone-1:
    image: chamuka-plane:latest
    container_name: fleet-drone-1
    restart: unless-stopped
    depends_on:
      - controller
      - egress-proxy
    command:
      - drone
      - --name
      - drone-trusted-1
      - --controller-url
      - ws://controller:8080
      - --cluster
      - "localhost:9090"
      - --pool
      - trusted
      - --ip
      - host.docker.internal
      - --egress-proxy-url
      - http://egress-proxy:3129
      - --egress-proxy-addr
      - host.docker.internal:3130
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RUST_LOG: info

  # Drone 2: untrusted pool (runc — gVisor requires Docker VM modification)
  drone-2:
    image: chamuka-plane:latest
    container_name: fleet-drone-2
    restart: unless-stopped
    depends_on:
      - controller
      - egress-proxy
    command:
      - drone
      - --name
      - drone-untrusted-1
      - --controller-url
      - ws://controller:8080
      - --cluster
      - "localhost:9090"
      - --pool
      - untrusted
      - --ip
      - host.docker.internal
      - --egress-proxy-url
      - http://egress-proxy:3129
      - --egress-proxy-addr
      - host.docker.internal:3130
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RUST_LOG: info

  # Drone 3: untrusted pool (second drone for scheduling distribution)
  drone-3:
    image: chamuka-plane:latest
    container_name: fleet-drone-3
    restart: unless-stopped
    depends_on:
      - controller
      - egress-proxy
    command:
      - drone
      - --name
      - drone-untrusted-2
      - --controller-url
      - ws://controller:8080
      - --cluster
      - "localhost:9090"
      - --pool
      - untrusted
      - --ip
      - host.docker.internal
      - --egress-proxy-url
      - http://egress-proxy:3129
      - --egress-proxy-addr
      - host.docker.internal:3130
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RUST_LOG: info

  registry:
    image: registry:2
    container_name: fleet-registry
    restart: unless-stopped
    volumes:
      - registry:/var/lib/registry
    ports:
      - "127.0.0.1:5000:5000"

  echo-server:
    image: node:24-slim
    container_name: fleet-echo-server
    restart: unless-stopped
    command:
      - node
      - -e
      - |
        require('http').createServer((req, res) => {
          const body = JSON.stringify({ method: req.method, url: req.url, headers: req.headers }, null, 2);
          res.writeHead(200, { 'Content-Type': 'application/json' });
          res.end(body);
        }).listen(8080, () => console.log('echo-server on :8080'));
    ports:
      - "127.0.0.1:8888:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Egress proxy spike: forward HTTP proxy that injects credential headers
  # based on destination. Admin API on :3129 receives credential bindings.
  # Sandboxes use it via HTTP_PROXY=http://host.docker.internal:3128
  egress-proxy:
    image: node:24
    container_name: fleet-egress-proxy
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./egress-proxy:/app:ro
      - egress-ca:/data/ca
    command:
      - node
      - /app/proxy.mjs
    environment:
      CA_DIR: /data/ca
    ports:
      - "127.0.0.1:3128:3128"
      - "127.0.0.1:3129:3129"
      - "127.0.0.1:3130:3130"
      - "127.0.0.1:3131:3131"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  registry:
  egress-ca:
