# Full dev fleet — multi-drone cluster running entirely in Docker.
#
# Replaces the Vagrant setup when VirtualBox is unavailable.
# Topology:
#   - 1 controller
#   - 1 proxy
#   - 3 drones (1 trusted/runc, 2 untrusted/runc — gVisor requires host VM config)
#   - 1 postgres
#   - 1 registry
#
# All drones share the host Docker socket and spawn sandbox containers
# as siblings. The proxy routes to those containers via host.docker.internal.
#
# Usage:
#   cd dev-fleet && docker compose up -d
#   docker compose exec drone-1 plane drone --help   # inspect
#   ../dev-fleet/scripts/smoke-test.sh               # e2e test

name: sandbox-dev-fleet

services:
  postgres:
    image: postgres:16
    container_name: fleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  controller:
    image: chamuka-plane:latest
    container_name: fleet-controller
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - controller
      - --db
      - postgres://postgres@postgres
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --default-cluster
      - "localhost:9090"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      RUST_LOG: info

  proxy:
    image: chamuka-plane:latest
    container_name: fleet-proxy
    restart: unless-stopped
    depends_on:
      - controller
    command:
      - proxy
      - --controller-url
      - ws://controller:8080
      - --cluster
      - "localhost:9090"
      - --http-port
      - "9090"
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      RUST_LOG: info

  # Drone 1: trusted pool (runc)
  drone-1:
    image: chamuka-plane:latest
    container_name: fleet-drone-1
    restart: unless-stopped
    depends_on:
      - controller
    command:
      - drone
      - --name
      - drone-trusted-1
      - --controller-url
      - ws://controller:8080
      - --cluster
      - "localhost:9090"
      - --pool
      - trusted
      - --ip
      - host.docker.internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RUST_LOG: info

  # Drone 2: untrusted pool (runc — gVisor requires Docker VM modification)
  drone-2:
    image: chamuka-plane:latest
    container_name: fleet-drone-2
    restart: unless-stopped
    depends_on:
      - controller
    command:
      - drone
      - --name
      - drone-untrusted-1
      - --controller-url
      - ws://controller:8080
      - --cluster
      - "localhost:9090"
      - --pool
      - untrusted
      - --ip
      - host.docker.internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RUST_LOG: info

  # Drone 3: untrusted pool (second drone for scheduling distribution)
  drone-3:
    image: chamuka-plane:latest
    container_name: fleet-drone-3
    restart: unless-stopped
    depends_on:
      - controller
    command:
      - drone
      - --name
      - drone-untrusted-2
      - --controller-url
      - ws://controller:8080
      - --cluster
      - "localhost:9090"
      - --pool
      - untrusted
      - --ip
      - host.docker.internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RUST_LOG: info

  registry:
    image: registry:2
    container_name: fleet-registry
    restart: unless-stopped
    volumes:
      - registry:/var/lib/registry
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  pgdata:
  registry:
